# Copy to ./butcherbird.toml or ~/.config/butcherbird/butcherbird.toml.
# Prefer environment variables over api_key in this file.
# ABUSEIPDB_API_KEY, URLHAUS_AUTH_KEY, VIRUSTOTAL_API_KEY, OTX_API_KEY,
# GREYNOISE_API_KEY, SHODAN_API_KEY, URLSCAN_API_KEY, THREATFOX_AUTH_KEY,
# MALWAREBAZAAR_AUTH_KEY, SAFEBROWSING_API_KEY
# Mail: BUTCHERBIRD_SMTP_USERNAME, BUTCHERBIRD_SMTP_PASSWORD, BUTCHERBIRD_MAIL_TOKEN
# OpenPhish, Spamhaus, RDAP and WHOIS do not take a key.

profile = "default"

[profiles.default]
max_concurrency = 8
timeout_secs = 20

[profiles.default.cache]
enabled = true
ttl_secs = 86400

[profiles.default.providers.abuseipdb]
api_key_env = "ABUSEIPDB_API_KEY"
rate_per_minute = 60

[profiles.default.providers.urlhaus]
api_key_env = "URLHAUS_AUTH_KEY"
rate_per_minute = 60

[profiles.default.providers.virustotal]
api_key_env = "VIRUSTOTAL_API_KEY"
rate_per_minute = 4

[profiles.default.providers.otx]
api_key_env = "OTX_API_KEY"
rate_per_minute = 30

[profiles.default.providers.greynoise]
api_key_env = "GREYNOISE_API_KEY"
rate_per_minute = 10

[profiles.default.providers.shodan]
api_key_env = "SHODAN_API_KEY"
rate_per_minute = 60

[profiles.default.providers.urlscan]
api_key_env = "URLSCAN_API_KEY"
rate_per_minute = 30

[profiles.default.providers.threatfox]
api_key_env = "THREATFOX_AUTH_KEY"
rate_per_minute = 60

[profiles.default.providers.malwarebazaar]
api_key_env = "MALWAREBAZAAR_AUTH_KEY"
rate_per_minute = 60

[profiles.default.providers.safebrowsing]
api_key_env = "SAFEBROWSING_API_KEY"
rate_per_minute = 60

[profiles.default.providers.openphish]
rate_per_minute = 2

[profiles.default.providers.spamhaus-zen]
rate_per_minute = 30

[profiles.default.providers.spamhaus-dbl]
rate_per_minute = 30

[profiles.default.providers.rdap]
rate_per_minute = 30

[profiles.default.providers.whois]
rate_per_minute = 10

[profiles.default.report]
yes = false

[profiles.default.report.abuseipdb]
categories = "15"

[profiles.default.report.threatfox]
threat_type = "payload_delivery"
malware = "unknown"
confidence_level = 50

# Netcraft sandbox is the default. Set sandbox = false only for a real report.
# email is the contact Netcraft writes back to. Empty skips the reporter.
[profiles.default.report.netcraft]
sandbox = true
reason = "Reported by Butcherbird"

# Abuse mail uses the RDAP abuse contact. Set from, and either smtp_host or http_url.
# A dry run still queries RDAP. It does not connect to SMTP or POST the mail.
# [profiles.default.report.email]
# from = "reports@example.com"
# smtp_host = "smtp.example.com"
# smtp_port = 587
# smtp_starttls = true

# Local pack for portals that have no submit API. Not sent, even with --submit.
[profiles.default.report.evidence]
enabled = true
dir = "butcherbird-evidence"

# Drop a file of the same name here to replace one built-in template.
# templates_dir = "templates"
