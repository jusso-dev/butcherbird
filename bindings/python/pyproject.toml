[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "butcherbird"
version = "0.1.0"
description = "Threat-intel lookups and abuse reporting"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Justin Middler" }]
keywords = ["threat-intelligence", "ioc", "security"]

[tool.maturin]
module-name = "butcherbird._native"
python-source = "python"
bindings = "pyo3"
