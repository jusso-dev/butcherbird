[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "butcherbird"
version = "0.1.0"
description = "Threat-intel lookups and abuse reporting"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Justin Middler" }]
keywords = ["threat-intelligence", "ioc", "security"]

[tool.maturin]
module-name = "butcherbird._native"
python-source = "python"
bindings = "pyo3"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
# mypy 2.x cannot target 3.9. The package still runs on 3.9.
python_version = "3.10"
mypy_path = "python"
files = ["python/butcherbird/__init__.py", "tests"]

[[tool.mypy.overrides]]
module = "butcherbird._native"
ignore_missing_imports = true
